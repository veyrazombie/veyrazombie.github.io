<!DOCTYPE html>
<html lang="en">
    <head>
        <title>VEYRA</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <meta name="description" content="VEYRA: a zombie outbreak RTS on real cities, played in the browser.">
        <link rel="icon" type="image/png" href="favicon.png">
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: #000;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #canvas {
                border: none;
            }
            #message {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                color: #e8ecf2;
                font: 16px/1.5 system-ui, sans-serif;
                text-align: center;
            }
            #veyra-attente {
                position: fixed;
                inset: 0;
                z-index: 5;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #090b12;
                color: #e8ecf2;
                font: 16px/1.4 system-ui, sans-serif;
            }
            #veyra-attente img {
                width: min(400px, 70vw);
                animation: respire 2.6s ease-in-out infinite;
            }
            @keyframes respire { 50% { transform: scale(1.012); } }
            .rail {
                position: relative;
                width: min(480px, 78vw);
                height: 14px;
                margin-top: 34px;
                border-radius: 999px;
                background: #141a24;
                box-shadow: 0 0 0 3px rgba(255, 255, 255, .06);
            }
            .plein {
                position: absolute;
                inset: 0 auto 0 0;
                width: 0;
                border-radius: 999px;
                background: linear-gradient(#8fe07f, #5cc74d 55%, #4fb341);
                box-shadow: 0 0 14px rgba(110, 210, 88, .55), 0 0 4px rgba(110, 210, 88, .8);
                overflow: hidden;
                transition: width .25s ease-out;
            }
            .plein::after {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                width: 60px;
                left: -60px;
                border-radius: 999px;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
                animation: eclat 1.8s ease-in-out infinite;
            }
            @keyframes eclat { to { left: 110%; } }
            .legende {
                display: flex;
                justify-content: space-between;
                width: min(480px, 78vw);
                margin-top: 12px;
                opacity: .85;
            }
            .legende b {
                color: #8ce67c;
                font-weight: 600;
            }
            #message[hidden] {
                display: none;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div>
            <canvas id="canvas"></canvas>
        </div>
        <div id="veyra-attente">
            <img src="favicon.png" alt="VEYRA">
            <div class="rail"><div class="plein" id="plein"></div></div>
            <div class="legende"><span>Downloading the game…</span><b id="pourcent">0 %</b></div>
        </div>
        <div id="message" hidden>
            <p>Your browser can't run VEYRA (it needs WebAssembly GC): please use a recent Chrome, Edge, Firefox or Safari.<br><br>
            Ton navigateur ne peut pas lancer VEYRA (il lui faut WebAssembly GC) : utilise un Chrome, Edge, Firefox ou Safari récent.</p>
        </div>
        <script>
            // la barre du téléchargement : les fichiers demandés et reçus ; elle s'arrête à 45 % (le jeu prend la suite, même barre)
            (() => {
                let demandes = 0, recus = 0, montre = 0;
                const plein = document.getElementById("plein"), pc = document.getElementById("pourcent");
                const ouvrir = XMLHttpRequest.prototype.send;
                XMLHttpRequest.prototype.send = function (...a) {
                    demandes++;
                    this.addEventListener("loadend", () => recus++);
                    return ouvrir.apply(this, a);
                };
                const chercher = window.fetch;
                window.fetch = (...a) => { demandes++; return chercher(...a).finally(() => recus++); };
                const t0 = performance.now();
                const tic = () => {
                    if (!document.getElementById("veyra-attente")) return;
                    const fichiers = demandes ? recus / demandes : 0, temps = 1 - Math.exp(-(performance.now() - t0) / 9000);
                    montre = Math.max(montre, 0.45 * Math.min(1, 0.7 * fichiers + 0.3 * temps));
                    plein.style.width = (montre * 100) + "%";
                    pc.textContent = Math.round(montre * 100) + " %";
                    requestAnimationFrame(tic);
                };
                tic();
            })();
        </script>
        <script>
            async function start() {
                try {
                    let teavm = await TeaVM.wasmGC.load("app.wasm");
                    teavm.exports.main([]);
                } catch (e) {
                    console.error(e);
                    document.getElementById("message").hidden = false;
                    document.getElementById("veyra-attente")?.remove();
                }
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.wasm-runtime.js"></script>
    </body>
</html>
